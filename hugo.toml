baseURL = 'https://vankare.github.io'
locale = 'zh-cn'
title = 'Vankare Blohg'
theme = 'hugo-coder'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  author = "Vankare"
  info = "后端开发 / 分享学习历程"
  colorScheme = "auto"
  
  avatarURL = "images/avatar.jpg"
  customCSS = ["css/custom.css"]
  
  # 社交链接
  [[params.social]]
    name = "GitHub"
    icon = "fa-brands fa-github"
    url = "https://github.com/vankare"
  [[params.social]]
    name = "Email"
    icon = "fa-solid fa-envelope"
    url = "mailto:gr.dev@outlook.com"
  [[params.social]]
    name = "WeChat"
    icon = "fa-brands fa-weixin"
    url = "/wechat/" # 指向 static/wechat/index.html

[[menus.main]]
  name = "Tags"
  pageRef = "tags"
  weight = 10 

[[menus.main]]
  name = "Posts"
  pageRef = "posts"
  weight = 5

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 5   
    ordered = false
  
[params.entry]
  toc = true
  tocOpen = true  
